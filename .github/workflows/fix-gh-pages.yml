name: Fix gh-pages symlinks

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fix-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove dangling symlinks
        run: |
          dangling=$(find . -xtype l -not -path './.git/*')
          if [ -n "$dangling" ]; then
            echo "$dangling" | xargs git rm
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: remove dangling symlinks from gh-pages"
            git push origin gh-pages
          else
            echo "No dangling symlinks found, nothing to do."
          fi
